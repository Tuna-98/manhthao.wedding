    <style>
      @font-face {
        font-family: "High Spirited";
        src: url("asset/fonts/vip-high-spirited.otf") format("opentype");
        font-style: normal;
        font-display: swap;
      }

      :root {
        --paper: #f7f5ee;
        --ink: #4e6437;
        --line: #d9dcc9;
        --mute: #86916f;
        --veil: rgba(24, 31, 17, 0.95);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper) url("asset/images/background.jpg") repeat center /
          640px auto;
        color: var(--ink);
        font: 400 16px/1.65 Lora, Georgia, "Times New Roman", serif;
      }

      a {
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }

      .page {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 20px 96px;
      }

      /* ---------- đầu trang ---------- */
      .masthead {
        text-align: center;
        padding: 68px 0 34px;
      }

      .eyebrow {
        font-family: "Dancing Script", cursive;
        font-size: 30px;
        line-height: 1;
        color: var(--mute);
      }

      .display {
        margin: 6px 0 0;
        font-family: "High Spirited", "Brush Script MT", cursive;
        font-size: clamp(62px, 12vw, 104px);
        font-weight: 400;
        line-height: 1.05;
        text-wrap: balance;
      }

      /* con dấu sáp nhánh ô liu, lấy lại từ thiệp */
      .seal {
        display: block;
        width: 46px;
        height: 46px;
        margin: 16px auto 18px;
      }

      .standfirst {
        max-width: 46ch;
        margin: 0 auto;
        font-style: italic;
        color: var(--mute);
      }

      /* ---------- lưới ảnh ---------- */
      .gallery {
        columns: 3 260px;
        column-gap: 22px;
      }

      .shot {
        margin: 0 0 22px;
        break-inside: avoid;
      }

      .shot button {
        all: unset;
        display: block;
        width: 100%;
        cursor: zoom-in;
      }

      .shot img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 10px;
        background: #eceade;
        box-shadow: 0 1px 2px rgba(39, 50, 28, 0.08),
          0 14px 30px -18px rgba(39, 50, 28, 0.4);
        transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),
          box-shadow 0.45s ease;
      }

      .shot button:hover img,
      .shot button:focus-visible img {
        transform: translateY(-3px);
        box-shadow: 0 2px 4px rgba(39, 50, 28, 0.1),
          0 22px 42px -18px rgba(39, 50, 28, 0.48);
      }

      /* hiện dần khi cuộn tới */
      .reveal {
        opacity: 0;
        transform: translateY(18px);
        transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .reveal.in {
        opacity: 1;
        transform: none;
      }

      /* ---------- chân trang ---------- */
      .foot {
        margin-top: 26px;
        padding-top: 30px;
        border-top: 1px solid var(--line);
        text-align: center;
      }

      .back {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 13px 26px;
        border: 1px solid var(--line);
        border-radius: 9999px;
        font-size: 13px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-decoration: none;
        transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
      }

      .back:hover {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--paper);
      }

      .signoff {
        margin: 22px 0 0;
        font-family: "Dancing Script", cursive;
        font-size: 26px;
        color: var(--mute);
      }

      /* ---------- xem toàn màn hình ---------- */
      .viewer {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 22px;
        background: var(--veil);
        opacity: 0;
        transition: opacity 0.22s ease;
      }

      .viewer.open {
        display: flex;
        opacity: 1;
      }

      .viewer img {
        max-width: 100%;
        max-height: calc(100dvh - 112px);
        display: block;
        object-fit: contain;
        border-radius: 4px;
        box-shadow: 0 30px 70px -24px rgba(0, 0, 0, 0.8);
        transition: opacity 0.22s ease;
      }

      .viewer .count {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 24px;
        text-align: center;
        color: rgba(247, 245, 238, 0.82);
        font-size: 13px;
        letter-spacing: 0.14em;
        font-variant-numeric: tabular-nums;
      }

      .viewer button {
        position: absolute;
        display: grid;
        place-items: center;
        border: 1px solid rgba(247, 245, 238, 0.3);
        border-radius: 9999px;
        background: rgba(24, 31, 17, 0.34);
        color: rgba(247, 245, 238, 0.94);
        cursor: pointer;
        transition: background 0.22s ease;
      }

      .viewer button:hover {
        background: rgba(247, 245, 238, 0.18);
      }

      .viewer .prev,
      .viewer .next {
        top: 50%;
        transform: translateY(-50%);
        width: 48px;
        height: 48px;
        font-size: 22px;
        line-height: 1;
      }

      .viewer .prev {
        left: 16px;
      }

      .viewer .next {
        right: 16px;
      }

      .viewer .shut {
        top: 18px;
        right: 18px;
        width: 42px;
        height: 42px;
        font-size: 17px;
      }

      /* ---------- nhạc lễ đường ---------- */
      /* cùng kiểu với nút nhạc trên thiệp: nốt nhạc xoay khi phát, gạch chéo khi tắt */
      .tune {
        position: fixed;
        right: 14px;
        bottom: 14px;
        z-index: 60;
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 9999px;
        background: rgba(17, 24, 39, 0.88);
        color: #fff;
        cursor: pointer;
        opacity: 0.96;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22);
        transition: opacity 0.22s ease;
      }

      .tune:hover {
        opacity: 1;
      }

      .tune svg {
        display: block;
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .tune.playing svg {
        animation: tune-spin 5s linear infinite;
      }

      .tune.muted::before {
        content: "";
        position: absolute;
        width: 2.5px;
        height: 31px;
        border-radius: 2px;
        background: #fff;
        transform: rotate(45deg);
      }

      /* bị trình duyệt chặn tự phát (khách chưa tự tắt) -> vòng sáng nhắc chạm */
      .tune.muted:not(.by-user)::after {
        content: "";
        position: absolute;
        inset: -4px;
        border: 1px solid rgba(17, 24, 39, 0.55);
        border-radius: 9999px;
        pointer-events: none;
        animation: nudge 2.8s ease-out infinite;
      }

      @keyframes tune-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes nudge {
        0% {
          transform: scale(0.88);
          opacity: 0.5;
        }
        70%,
        100% {
          transform: scale(1.3);
          opacity: 0;
        }
      }

      @media (max-width: 700px) {
        .page {
          padding: 0 14px 76px;
        }

        .masthead {
          padding: 44px 0 24px;
        }

        .gallery {
          columns: 2 140px;
          column-gap: 12px;
        }

        .shot {
          margin-bottom: 12px;
        }

        .shot img {
          border-radius: 7px;
        }

        .viewer .prev,
        .viewer .next {
          width: 40px;
          height: 40px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }

        .reveal {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>

      id="tune"
      aria-pressed="false"
      title="Bật nhạc lễ đường"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 18V6l10-2v12" />
        <circle cx="7" cy="18" r="3" />
        <circle cx="17" cy="16" r="3" />

    <script>
      (function () {
        var shots = [].slice.call(document.querySelectorAll(".gallery img"));
        var viewer = document.getElementById("viewer");
        var stage = document.getElementById("stage");
        var count = document.getElementById("count");
        var at = 0;

        /* hiện dần khi cuộn tới */
        var figures = [].slice.call(document.querySelectorAll(".reveal"));
        if ("IntersectionObserver" in window) {
          var obs = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (entry) {
                if (!entry.isIntersecting) return;
                entry.target.classList.add("in");
                obs.unobserve(entry.target);
              });
            },
            { rootMargin: "0px 0px -8% 0px", threshold: 0.05 }
          );
          figures.forEach(function (f) {
            obs.observe(f);
          });
        } else {
          figures.forEach(function (f) {
            f.classList.add("in");
          });
        }

        /* tải sẵn ảnh liền kề để lật cho mượt */
        function warm(i) {
          [i - 1, i + 1].forEach(function (j) {
            var shot = shots[(j + shots.length) % shots.length];
            if (!shot) return;
            var im = new Image();
            im.decoding = "async";
            im.src = shot.src;
          });
        }

        function show(i) {
          at = (i + shots.length) % shots.length;
          var shot = shots[at];
          stage.style.opacity = "0";
          var pre = new Image();
          pre.onload = function () {
            stage.src = shot.src;
            stage.alt = shot.alt;
            requestAnimationFrame(function () {
              stage.style.opacity = "1";
            });
          };
          pre.src = shot.src;
          count.textContent = at + 1 + " / " + shots.length;
          warm(at);
        }

        function open(i) {
          show(i);
          viewer.classList.add("open");
          document.body.style.overflow = "hidden";
        }

        function shut() {
          viewer.classList.remove("open");
          document.body.style.overflow = "";
          stage.removeAttribute("src");
        }

        shots.forEach(function (shot, i) {
          shot.parentNode.addEventListener("click", function () {
            open(i);
          });
        });

        document.getElementById("shut").addEventListener("click", shut);
        document.getElementById("prev").addEventListener("click", function () {
          show(at - 1);
        });
        document.getElementById("next").addEventListener("click", function () {
          show(at + 1);
        });
        viewer.addEventListener("click", function (e) {
          if (e.target === viewer) shut();
        });

        document.addEventListener("keydown", function (e) {
          if (!viewer.classList.contains("open")) return;
          if (e.key === "Escape") shut();
          if (e.key === "ArrowLeft") show(at - 1);
          if (e.key === "ArrowRight") show(at + 1);
        });

        /* nhạc lễ đường: luôn bật khi vào trang.
           Trình duyệt chặn tự phát có tiếng trước khi khách chạm vào màn hình,
           nên nếu bị chặn thì phát ngay ở thao tác đầu tiên (chạm / cuộn / bấm). */
        var tune = document.getElementById("tune");
        var song = document.getElementById("song");
        var muted = false; // chỉ bật lên khi khách tự bấm nút tắt
        song.volume = 0.6;

        function paint() {
          var on = !song.paused;
          tune.classList.toggle("playing", on);
          tune.classList.toggle("muted", !on);
          tune.classList.toggle("by-user", !on && muted);
          tune.setAttribute("aria-pressed", String(on));
          tune.title = on ? "Tắt nhạc" : "Bật nhạc lễ đường";
        }

        function play() {
          var p = song.play();
          if (p && p.catch) p.catch(function () {});
        }

        var gestures = ["pointerdown", "touchstart", "keydown", "scroll"];

        /* Chạm bất kỳ đâu thì mở nhạc — TRỪ chính nút nhạc, vì nút đã có handler
           riêng. Nếu không loại trừ, pointerdown sẽ phát nhạc trước, rồi click của
           nút thấy đang phát nên lại tắt ngay, nhìn như bấm không ăn. */
        function kick(e) {
          if (e && e.target && e.target.closest && e.target.closest("#tune")) return;
          if (!muted && song.paused) play();
        }

        song.addEventListener("playing", function () {
          gestures.forEach(function (type) {
            document.removeEventListener(type, kick, true);
          });
          paint();
        });
        song.addEventListener("play", paint);
        song.addEventListener("pause", paint);
        song.addEventListener("canplay", kick);

        /* thuộc tính autoplay có thể đã cho nhạc chạy trước khi script gắn listener,
           lúc đó sự kiện "playing" đã bắn mất -> đồng bộ lại trạng thái nút ngay */
        paint();

        gestures.forEach(function (type) {
          document.addEventListener(type, kick, true);
        });

        /* thử lại vài nhịp: lần play() đầu có thể rơi vào lúc file chưa sẵn sàng
           hoặc trình duyệt chưa kịp ghi nhận khách đã bấm link ở thiệp */
        var tries = 0;
        var retry = setInterval(function () {
          if (muted || !song.paused || ++tries > 12) {
            clearInterval(retry);
            return;
          }
          play();
        }, 400);

        /* Quyết định theo hình đang hiện trên nút, không theo song.paused:
           play() là bất đồng bộ nên lúc click chạy, trạng thái thật có thể đã đổi
           so với cái khách nhìn thấy. */
        tune.addEventListener("click", function (e) {
          e.stopPropagation();
          if (tune.classList.contains("muted")) {
            muted = false;
            play();
          } else {
            muted = true;
            song.pause();
          }
          paint();
        });

        kick();

        /* quẹt ngang trên điện thoại */
        var x0 = null;
        var y0 = null;
        viewer.addEventListener(
          "touchstart",
          function (e) {
            var t = e.changedTouches[0];
            x0 = t.clientX;
            y0 = t.clientY;
          },
          { passive: true }
        );
        viewer.addEventListener(
          "touchend",
          function (e) {
            if (x0 === null) return;
            var t = e.changedTouches[0];
            var dx = t.clientX - x0;
            var dy = t.clientY - y0;
            x0 = null;
            if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
              show(dx < 0 ? at + 1 : at - 1);
            }
          },
          { passive: true }
        );
      })();
    </script>
  </body>
</html>
